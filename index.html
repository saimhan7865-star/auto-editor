<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto-Editor Pro | CapCut Web Clone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-zinc-950 text-white h-screen flex flex-col overflow-hidden font-sans select-none">

  <!-- Top Navbar -->
  <header class="h-12 border-b border-zinc-800 flex items-center justify-between px-4 bg-zinc-900">
    <h1 class="font-bold text-lg text-blue-500 flex items-center gap-2">
      <i data-lucide="scissors" class="w-5 h-5"></i> Auto-Editor Pro
    </h1>
    <div class="flex items-center gap-3">
      <button id="export-btn" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 px-4 py-1.5 rounded-md text-sm font-semibold transition shadow-md">
        <i data-lucide="download" class="w-4 h-4"></i> Export Video
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Left Sidebar: Tools & Media -->
    <aside class="w-72 border-r border-zinc-800 bg-zinc-900/50 p-4 flex flex-col gap-5 overflow-y-auto">
      <div>
        <h2 class="font-semibold text-xs text-zinc-400 uppercase tracking-wider mb-2">Media Upload</h2>
        <label class="flex flex-col items-center justify-center gap-2 border-2 border-dashed border-zinc-700 hover:border-blue-500 p-5 rounded-xl text-sm text-zinc-300 transition cursor-pointer bg-zinc-900/80">
          <i data-lucide="upload-cloud" class="w-6 h-6 text-blue-400"></i>
          <span class="font-medium">Import Video File</span>
          <input type="file" id="video-upload" accept="video/*" class="hidden" />
        </label>
      </div>

      <!-- Quick Actions -->
      <div>
        <h2 class="font-semibold text-xs text-zinc-400 uppercase tracking-wider mb-2">Editor Tools</h2>
        <div class="grid grid-cols-2 gap-2">
          <button id="add-text-btn" class="flex items-center justify-center gap-2 p-2.5 bg-zinc-800 hover:bg-zinc-700 border border-zinc-700/50 rounded-lg text-xs font-medium text-zinc-200 transition">
            <i data-lucide="type" class="w-4 h-4 text-amber-400"></i> Add Text
          </button>
          <button id="reset-all-btn" class="flex items-center justify-center gap-2 p-2.5 bg-zinc-800 hover:bg-zinc-700 border border-zinc-700/50 rounded-lg text-xs font-medium text-zinc-200 transition">
            <i data-lucide="rotate-ccw" class="w-4 h-4 text-red-400"></i> Reset All
          </button>
        </div>
      </div>

      <!-- Filter Presets -->
      <div>
        <h2 class="font-semibold text-xs text-zinc-400 uppercase tracking-wider mb-2">Preset FX</h2>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="applyPreset('normal')" class="p-2 bg-zinc-800 hover:bg-zinc-700 rounded text-xs text-zinc-300 border border-zinc-700/40">Normal</button>
          <button onclick="applyPreset('cinematic')" class="p-2 bg-zinc-800 hover:bg-zinc-700 rounded text-xs text-zinc-300 border border-zinc-700/40">Cinematic</button>
          <button onclick="applyPreset('vintage')" class="p-2 bg-zinc-800 hover:bg-zinc-700 rounded text-xs text-zinc-300 border border-zinc-700/40">Vintage</button>
          <button onclick="applyPreset('bw')" class="p-2 bg-zinc-800 hover:bg-zinc-700 rounded text-xs text-zinc-300 border border-zinc-700/40">B & W</button>
        </div>
      </div>
    </aside>

    <!-- Center Preview Canvas -->
    <main class="flex-1 bg-black flex flex-col items-center justify-center p-4 relative overflow-hidden">
      <div id="video-container" class="w-[720px] h-[405px] bg-zinc-900 border border-zinc-800 rounded-lg flex items-center justify-center relative shadow-2xl overflow-hidden">
        <video id="main-video" class="w-full h-full object-contain hidden"></video>
        
        <!-- Overlay Text -->
        <div id="overlay-text" class="absolute cursor-move font-bold text-white text-3xl hidden drop-shadow-lg select-none px-2 py-1 rounded border border-transparent hover:border-blue-500">
          Sample Subtitle
        </div>

        <div id="placeholder-text" class="flex flex-col items-center text-zinc-500">
          <i data-lucide="film" class="w-12 h-12 mb-2 stroke-1"></i>
          <p class="text-sm">Import video to start editing</p>
        </div>
      </div>

      <!-- Player Controls -->
      <div class="mt-4 flex items-center gap-6 bg-zinc-900/90 px-6 py-2 rounded-full border border-zinc-800">
        <button id="play-btn" class="p-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-full transition">
          <i data-lucide="play" class="w-5 h-5 fill-current"></i>
        </button>

        <div class="flex items-center gap-2">
          <button id="mute-btn" class="text-zinc-400 hover:text-white">
            <i data-lucide="volume-2" class="w-5 h-5"></i>
          </button>
          <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="1" class="w-20 h-1 bg-zinc-700 rounded appearance-none cursor-pointer">
        </div>

        <span id="time-display" class="text-xs font-mono text-zinc-400">00:00 / 00:00</span>
      </div>
    </main>

    <!-- Right Sidebar: Properties Panel -->
    <aside class="w-72 border-l border-zinc-800 bg-zinc-900/50 p-4 flex flex-col gap-5 overflow-y-auto">
      <h2 class="font-semibold text-xs text-zinc-400 uppercase tracking-wider">Adjustment Panel</h2>

      <!-- Color Adjustments -->
      <div class="space-y-3 border-b border-zinc-800 pb-4">
        <div class="flex items-center justify-between">
          <label class="text-xs text-zinc-300 font-medium">Color Adjustments</label>
          <button id="reset-filters-btn" class="text-[10px] text-blue-400 hover:underline">Reset</button>
        </div>
        
        <div class="space-y-2.5">
          <div>
            <div class="flex justify-between text-xs text-zinc-400 mb-1">
              <span>Brightness</span>
              <span id="brightness-val">100%</span>
            </div>
            <input type="range" id="brightness" min="0" max="200" value="100" class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer">
          </div>

          <div>
            <div class="flex justify-between text-xs text-zinc-400 mb-1">
              <span>Contrast</span>
              <span id="contrast-val">100%</span>
            </div>
            <input type="range" id="contrast" min="0" max="200" value="100" class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer">
          </div>

          <div>
            <div class="flex justify-between text-xs text-zinc-400 mb-1">
              <span>Saturation</span>
              <span id="saturate-val">100%</span>
            </div>
            <input type="range" id="saturate" min="0" max="200" value="100" class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer">
          </div>
        </div>
      </div>

      <!-- Text Styling -->
      <div id="text-properties" class="space-y-3">
        <label class="text-xs text-zinc-300 font-medium">Text Styling</label>
        <input type="text" id="text-input" placeholder="Enter custom text..." class="w-full bg-zinc-800 border border-zinc-700/60 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500">
        
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] text-zinc-400 block mb-1">Color</label>
            <input type="color" id="text-color" value="#ffffff" class="w-full h-8 bg-transparent cursor-pointer rounded border border-zinc-700">
          </div>
          <div>
            <label class="text-[10px] text-zinc-400 block mb-1">Size</label>
            <input type="number" id="text-size" value="32" min="12" max="100" class="w-full bg-zinc-800 border border-zinc-700/60 rounded px-2 py-1 text-xs text-white">
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Bottom Timeline Workspace -->
  <footer class="h-48 border-t border-zinc-800 bg-zinc-900/90 flex flex-col relative select-none">
    <div class="h-8 border-b border-zinc-800 px-4 flex items-center justify-between text-xs text-zinc-400">
      <span class="flex items-center gap-1"><i data-lucide="layers" class="w-3.5 h-3.5"></i> Timeline Track View</span>
      <span class="text-[10px] text-zinc-500">Click timeline to seek video</span>
    </div>

    <!-- Timeline Container -->
    <div id="timeline-container" class="flex-1 relative overflow-x-auto p-3 bg-zinc-950/60 cursor-pointer">
      <div id="playhead" class="absolute top-0 bottom-0 w-0.5 bg-red-500 z-30 pointer-events-none left-0">
        <div class="w-3 h-3 bg-red-500 rounded-full -ml-1.25 -mt-1 shadow"></div>
      </div>

      <div class="space-y-2 pt-2">
        <div id="video-track" class="h-12 bg-blue-900/30 border border-blue-500/40 rounded-lg flex items-center px-3 text-xs text-blue-300 font-medium relative">
          <i data-lucide="film" class="w-4 h-4 mr-2"></i> Main Video Track
        </div>

        <div id="text-track" class="h-10 bg-amber-900/30 border border-amber-500/40 rounded-lg flex items-center px-3 text-xs text-amber-300 font-medium hidden relative">
          <i data-lucide="type" class="w-4 h-4 mr-2"></i> Text Subtitle Overlay Track
        </div>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
